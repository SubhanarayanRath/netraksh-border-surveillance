# NETRAKSH — Render Blueprint.
# Deploys the single-container app (Dockerfile) + a managed Postgres
# database in one pass via Render's "New > Blueprint" flow, pointed at
# this repo. See docs/DEPLOYMENT.md for the full walkthrough.
#
# SECRET_KEY and ADMIN_PASSWORD are auto-generated by Render at deploy
# time (generateValue: true) — real random values, never the
# CHANGE_ME_* placeholders backend/config.py defaults to locally, and
# never committed to source control. Retrieve ADMIN_PASSWORD from the
# Render dashboard (service > Environment tab) after first deploy to
# actually log in — see docs/DEPLOYMENT.md.
services:
  - type: web
    name: netraksh
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_OPERATOR_PASSWORD
        generateValue: true
      - key: INITIAL_AUDITOR_PASSWORD
        generateValue: true
      - key: COMMAND_ID
        value: COMMAND_A
      - key: DATABASE_URL
        value: "postgresql://postgres:Subham987%40%40@db.ngwcqdkmjevfakeclqbz.supabase.co:5432/postgres"
      - key: CORS_ORIGINS
        value: "https://netraksh.vercel.app"
      - key: FRONTEND_ORIGIN
        value: "https://netraksh.vercel.app"
      - key: VIDEO_SOURCE
        value: "demo/videos/vtest.avi"
