# NETRAKSH — Render Blueprint.
# Deploys the single-container app (Dockerfile) + a managed Postgres
# database in one pass via Render's "New > Blueprint" flow, pointed at
# this repo. See docs/DEPLOYMENT.md for the full walkthrough.
#
# SECRET_KEY, ADMIN_PASSWORD, and DATABASE_URL are never committed to
# source control.
#
# FIRST-TIME SETUP (after rotating the Supabase password):
#   1. In the Render dashboard → service → Environment tab, add:
#        DATABASE_URL = postgresql://<user>:<rotated-password>@<host>/<db>
#   2. All other secrets (SECRET_KEY, ADMIN_PASSWORD, INITIAL_OPERATOR_PASSWORD,
#      INITIAL_AUDITOR_PASSWORD) are auto-generated by Render at deploy time.
#   3. Retrieve ADMIN_PASSWORD from the Render dashboard after first deploy.
#
# SECURITY NOTE:
#   DATABASE_URL must ONLY be set through the Render dashboard's secret
#   environment management — never hardcoded here. The credential that was
#   previously hardcoded in this file has been revoked; see the security
#   incident log for remediation details.
services:
  - type: web
    name: netraksh
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_OPERATOR_PASSWORD
        generateValue: true
      - key: INITIAL_AUDITOR_PASSWORD
        generateValue: true
      - key: COMMAND_ID
        value: COMMAND_A
      - key: DATABASE_URL
        # REQUIRED: Set this in the Render dashboard → Environment tab.
        # Never hardcode here. Rotate via Supabase dashboard, then update Render.
        # REQUIRED: Set this in the Render dashboard → Environment tab.
        # Never hardcode here. Rotate via Supabase dashboard, then update Render.
        # Format: postgresql://<user>:<password>@<host>:<port>/<database>
        fromEnv: DATABASE_URL
      - key: EDGE_AUTH_TOKEN
        # Required when mTLS is not mandatory. Set the same secret on each
        # separately deployed edge device; never commit it.
        fromEnv: EDGE_AUTH_TOKEN
      - key: CORS_ORIGINS
        value: "https://netraksh.vercel.app,https://netraksh-35030.web.app"
      - key: FRONTEND_ORIGIN
        value: "https://netraksh-35030.web.app"
      - key: VIDEO_SOURCE
        value: "demo/videos/vtest.avi"
      - key: ENV
        value: "production"
